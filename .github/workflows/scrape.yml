name: Scrape Live Sports

on:
  schedule:
    - cron: "7 * * * *"      # hourly, off the :00 mark so runs are less likely to be delayed
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # needed to push events.json back

concurrency:
  group: scrape
  cancel-in-progress: false   # never run two scrapes (and two pushes) at once

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      # Runs even when the scraper fails, so you can see what the runner saw.
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: output/debug/
          if-no-files-found: ignore
          retention-days: 7

      # Only reached when the scraper succeeded, so an empty result never overwrites good data.
      - name: Commit and push events.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/events.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update events.json [skip ci]"
            git pull --rebase
            git push
          fi
